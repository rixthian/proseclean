[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proseclean"
version = "0.1.0"
description = "Manuscript hygiene for authors: remove hidden characters and chat residue from prose, and flag typical AI phrasing for human review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["writing", "authors", "text-cleaning", "unicode", "manuscript", "markdown", "claude-skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Filters",
]

[project.urls]
Homepage = "https://github.com/rixthian/proseclean"
Issues = "https://github.com/rixthian/proseclean/issues"
Changelog = "https://github.com/rixthian/proseclean/blob/main/CHANGELOG.md"

[project.scripts]
proseclean = "proseclean.__main__:main"

[tool.setuptools]
packages = ["proseclean"]
