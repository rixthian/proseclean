[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proseclean"
version = "0.1.0"
description = "Manuscript hygiene for authors: remove hidden characters and chat residue from prose, and flag typical AI phrasing for human review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["writing", "text-cleaning", "unicode", "authors", "claude-skill"]

[project.scripts]
proseclean = "proseclean.__main__:main"

[tool.setuptools]
packages = ["proseclean"]
