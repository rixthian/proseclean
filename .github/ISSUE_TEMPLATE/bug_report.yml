name: Bug report
description: Something was changed that should not have been, or something was missed.
labels: [bug]
body:
  - type: textarea
    id: sample
    attributes:
      label: Small text sample
      description: Please keep it short and do not paste private manuscripts.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Python
      placeholder: "0.1.0, Python 3.12"
