name: Feature or rule request
description: Suggest a new hidden-character rule, phrase flag or format.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should ProseClean do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Where did you meet this in real text?
  - type: markdown
    attributes:
      value: |
        Reminder: ProseClean never rewrites wording automatically and has no detector-evasion features.
